<style>
/* Layout: colonna unica, elenco di link grandi su fondo panna/nero, palette del cliente */
:root{--bg:#EFEDE8;--fg:#141414;--muted:#6b6962;--line:#c9c6bd;--font:'Barlow',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#EFEDE8;--muted:#9a978f;--line:#3a3935;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--fg:#EFEDE8;--muted:#9a978f;--line:#3a3935;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:300;padding-inline:max(16px,5vw);padding-block:12vh 8vh}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:2.5rem}
h1{font-weight:500;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;margin:0}
p{margin:0;color:var(--muted);line-height:1.6}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li a{display:flex;justify-content:space-between;gap:1rem;padding-block:1.4rem;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:1.4rem;letter-spacing:.08em;text-transform:uppercase}
li a span{color:var(--muted);font-size:.8rem;letter-spacing:.1em;align-self:center}
li a:hover,li a:focus-visible{padding-left:.6rem;outline:none}
li a{transition:padding .2s}
@media (prefers-reduced-motion:reduce){li a{transition:none}}
</style>
